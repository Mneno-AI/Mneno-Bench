mneno_reranker_api_base: https://ai.api.nvidia.com/v1/retrieval/nvidia/reranking
mneno_reranker_api_key_required: true
mneno_reranker_candidate_limit: 50
mneno_reranker_cache_size: 4096
mneno_reranker_timeout_seconds: 60
mneno_reranker_retries: 2
